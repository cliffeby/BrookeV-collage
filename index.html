<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Collage</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .photo {
            position: absolute;
            width: 17vmin;
            border: 0.6vmin solid #f4f4f4;
            border-radius: 3px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
            transform: translate(-50%, -50%) rotate(var(--rot));
            transition: transform 0.25s ease, z-index 0s;
            cursor: pointer;
            z-index: var(--z);
        }
        .pop-in { animation: pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes pop {
            0%   { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scale(0); }
            100% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scale(1); }
        }
        .photo:hover { transform: translate(-50%, -50%) rotate(0deg) scale(1.25); z-index: 2000000; }
        .photo-label {
            display: none;
            position: absolute; transform: translate(-50%, -50%); z-index: 1999999; pointer-events: none;
            background: rgba(0, 0, 0, 0.75); color: #ff0; font: bold 12px monospace; padding: 2px 5px;
            border-radius: 3px; white-space: nowrap;
        }
        #lb-name { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #ff0; font: bold 18px monospace; background: rgba(0,0,0,0.75); padding: 4px 10px; border-radius: 4px; }
        .video-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(52vw, 70vh * 4 / 3);
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            z-index: 0;
            overflow: hidden;
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        #lightbox {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            display: none; align-items: center; justify-content: center; z-index: 3000000; cursor: zoom-out;
        }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 4px; }
        #easter-egg {
            position: fixed; inset: 0; display: none; z-index: 4000000;
            align-items: center; justify-content: center; pointer-events: none;
        }
        #easter-egg.show { display: flex; }
        #easter-egg img { height: 96vh; max-width: 96vw; object-fit: contain; filter: drop-shadow(0 10px 30px rgba(0,0,0,0.8)); }
    </style>
</head>
<body>
    <div class="video-card">
        <video src="clip.mp4" controls autoplay muted loop playsinline></video>
    </div>
    <div id="lightbox"><img alt=""><div id="lb-name"></div></div>
    <div id="easter-egg"><img alt=""></div>

    <script>
        const VIDEO_BASE = 'https://brookevcollage.z13.web.core.windows.net/videos/';
        const VIDEOS = ['Brooke1A.mp4','Brooke8.mp4', 'Brooke2.mp4', 'Brooke3.mp4', 
        'brooke4.mp4', 'Brooke5.mp4', 'Brooke10.mp4','Brooke11.mp4','Brooke6.mp4', 'Brooke7.mp4','clip.mp4']
            .map(n => VIDEO_BASE + n);
        // Placeholder photo library; replace with the real library list later.
        let PHOTOS = Array.from({ length: 16 }, (_, i) => `images/photo${String(i + 1).padStart(2, '0')}.jpg`);

        const video = document.querySelector('video');
        let current = 0;
        video.removeAttribute('loop');
        video.src = VIDEOS[0];
        const videoCard = document.querySelector('.video-card');
        let zCounter = 1;
        // Each time a video starts, lift it above every photo; later photos then cover its edges again.
        const raiseVideo = () => { videoCard.style.zIndex = zCounter++; };
        let advancing = false;
        const playNext = () => {
            if (advancing) return;
            advancing = true;
            current = (current + 1) % VIDEOS.length;
            video.src = VIDEOS[current];
            video.play().catch(() => {});
            raiseVideo();
        };
        video.addEventListener('loadstart', () => { advancing = false; });
        video.addEventListener('ended', playNext);
        video.addEventListener('error', playNext);

        // Photos glitch in continuously at random spots outside the video and are never
        // removed; each new one is layered on top of the earlier ones. Images load lazily.
        // After RECYCLE_AFTER photos are on screen, each new photo replaces the oldest one.
        const RECYCLE_AFTER = 100;
        // After every EGG_EVERY photos, cover the screen with the easter-egg image for EGG_MS.
        const EGG_EVERY = 100, EGG_MS = 3000;
        const EGG_URL = 'https://brookevcollage.z13.web.core.windows.net/easter/Apple.png';
        const egg = document.getElementById('easter-egg');
        egg.querySelector('img').src = EGG_URL;
        let shownCount = 0;
        const showEgg = () => {
            egg.classList.add('show');
            setTimeout(() => egg.classList.remove('show'), EGG_MS);
        };
        const onScreen = [];
        // Press D (or open with ?debug) to show each photo's file name; click a photo to see it large with its name.
        if (new URLSearchParams(location.search).has('debug')) document.body.classList.add('debug');
        const fileName = src => decodeURIComponent(src.split('/').pop());
        let deck = [];
        const nextPhoto = () => {
            if (!deck.length) {
                deck = PHOTOS.slice();
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }
            }
            return deck.pop();
        };

        let popTimer;
        function popPhoto() {
            const W = innerWidth, H = innerHeight;
            const v = document.querySelector('.video-card').getBoundingClientRect();
            const freeArea = W * H - (v.right - v.left) * (v.bottom - v.top);
            const base = Math.min(Math.sqrt(freeArea / 60) * 3.6, Math.min(W, H) * 0.4);
            let size = base * (0.7 + Math.random() * 0.6);
            let x, y, ok = false;
            // Aim about 40% of photos at the strips above and below the video, sized to fit them.
            const topH = v.top, botH = H - v.bottom;
            const stripH = Math.max(topH, botH);
            if (stripH > 40 && Math.random() < 0.4) {
                const useTop = topH >= botH ? Math.random() < 0.7 : Math.random() < 0.3;
                const h = useTop ? topH : botH;
                size = Math.min(size, h * 1.2 * (0.8 + Math.random() * 0.4));
                x = Math.random() * W;
                y = (useTop ? h / 2 : v.bottom + h / 2) + (Math.random() - 0.5) * h * 0.3;
                ok = true;
            }
            // Otherwise shrink until the photo fits in a free spot.
            for (let attempt = 0; attempt < 12 && !ok; attempt++) {
                const half = size * 0.55, o = size * 0.1;
                for (let t = 0; t < 40 && !ok; t++) {
                    x = Math.random() * W;
                    y = Math.random() * H;
                    // A photo may overlap the video by up to 10% of its size on any edge.
                    ok = !(x + half - o > v.left && x - half + o < v.right && y + half - o > v.top && y - half + o < v.bottom);
                }
                if (!ok) size *= 0.85;
            }

            if (ok) {
                const img = document.createElement('img');
                img.className = 'photo pop-in';
                img.alt = 'Photo';
                img.style.width = size + 'px';
                img.style.left = x + 'px';
                img.style.top = y + 'px';
                img.style.setProperty('--rot', (Math.random() - 0.5) * 30 + 'deg');
                // Add to the page only once loaded so the pop is visible exactly on the 2s beat;
                // a broken file is skipped and retried right away.
                img.addEventListener('load', () => {
                    img.style.setProperty('--z', zCounter++);
                    document.body.appendChild(img);
                    onScreen.push(img);
                    {
                        const label = document.createElement('div');
                        label.className = 'photo-label';
                        label.textContent = fileName(img.src);
                        label.style.left = img.style.left;
                        label.style.top = img.style.top;
                        label.style.zIndex = img.style.getPropertyValue('--z');
                        document.body.appendChild(label);
                        img._label = label;
                    }
                    if (onScreen.length > RECYCLE_AFTER) {
                        const old = onScreen.shift();
                        if (old._label) old._label.remove();
                        old.remove();
                    }
                    if (++shownCount % EGG_EVERY === 0) showEgg();
                });
                img.addEventListener('error', () => { clearTimeout(popTimer); popTimer = setTimeout(popPhoto, 50); });
                img.src = nextPhoto();
                popTimer = setTimeout(popPhoto, 2000);
            } else {
                popTimer = setTimeout(popPhoto, 2000);
            }
        }
        // Real library: photos/photos.json lists the files in the photos/ folder (served from Azure Blob static site).
        const PHOTO_BASE = 'https://brookevcollage.z13.web.core.windows.net/photos/';
        fetch(PHOTO_BASE + 'photos.json')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(list => { PHOTOS = list.map(n => PHOTO_BASE + n); })
            .catch(() => {})
            .finally(popPhoto);
        let resizeTimer;
        addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                clearTimeout(popTimer);
                popPhoto();
            }, 200);
        });

        const lb = document.getElementById('lightbox');
        document.addEventListener('click', e => {
            if (e.target.classList.contains('photo')) {
                lb.querySelector('img').src = e.target.src;
                document.getElementById('lb-name').textContent = fileName(e.target.src);
                lb.classList.add('open');
            } else if (lb.contains(e.target)) {
                lb.classList.remove('open');
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') lb.classList.remove('open');
            if (e.key === 'd' || e.key === 'D') document.body.classList.toggle('debug');
        });
    </script>
</body>
</html>
